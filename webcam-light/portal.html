<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>숲으로 여는 문 · 나의 요정</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030907;color:#e7eddf;font-family:system-ui,sans-serif}#scene{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}header{position:fixed;top:32px;left:36px;pointer-events:none}h1{font-size:24px;font-weight:400;letter-spacing:.08em;margin:0 0 12px}header p{font-size:13px;line-height:1.9;color:#9cafa2;margin:0}footer{position:fixed;bottom:28px;left:36px;right:36px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{border:1px solid #d9efcb33;border-radius:24px;background:#17271dd9;color:#e7eddf;padding:11px 18px;font:inherit;font-size:13px;cursor:pointer}button:hover,button:focus-visible{background:#294331}button:focus-visible{outline:2px solid #d5ebc0;outline-offset:3px}button:disabled{opacity:.5;cursor:wait}#camera{background:#d8e9bb;color:#18251a}#status{font-size:12px;color:#a9bca9;margin-left:auto;max-width:440px;line-height:1.7}#preview{position:fixed;left:36px;bottom:96px;display:none;width:110px;text-align:center;color:#b3c3ac;font-size:11px;pointer-events:none}#preview canvas{width:66px;height:84px;border:1px solid #d5ebc066;border-radius:50%;background:#16231b}#preview p{line-height:1.7;margin:8px -15px 0}video{display:none}@media(max-width:640px){header{top:22px;left:22px}h1{font-size:20px}footer{left:20px;right:20px;bottom:20px}#status{width:100%;margin:0}#preview{left:20px;bottom:140px}button{padding:10px 13px}}
</style>
</head>
<body>
<canvas id="scene" aria-label="마우스를 누른 채 원을 그리면 숲과 요정이 나타나는 포털"></canvas>
<header><h1>숲으로 여는 문</h1><p>마우스를 누른 채 커다란 원을 그려 보세요.<br>원을 닫으면 숲속에서 요정을 만날 수 있어요.</p></header>
<div id="preview"><canvas width="132" height="168" id="face-preview"></canvas><p>얼굴을 이 안에 맞춰 주세요</p></div>
<footer><button id="camera">웹캠 켜기</button><button id="reset">다시 그리기</button><button id="fullscreen">전체 화면</button><span id="status" role="status" aria-live="polite">웹캠을 켜면 요정 얼굴에 내 얼굴이 나타나요.</span></footer>
<video autoplay muted playsinline></video>
<script>
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d');
const video=document.querySelector('video'),camera=document.querySelector('#camera');
const status=document.querySelector('#status'),preview=document.querySelector('#preview');
const faceCanvas=document.querySelector('#face-preview'),faceCtx=faceCanvas.getContext('2d');
const forest=new Image();forest.src='forest.png';
let w=innerWidth,h=innerHeight,points=[],drawing=false,pointerId=null,portal=null,stream=null;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){w=innerWidth;h=innerHeight;const d=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);}
window.addEventListener('resize',()=>{const ow=w,oh=h;resize();if(portal){portal.x*=w/ow;portal.y*=h/oh;portal.r*=Math.min(w/ow,h/oh);}points=[];drawing=false;});resize();

function circleFromStroke(stroke){
 if(stroke.length<16)return null;
 const xs=stroke.map(p=>p.x),ys=stroke.map(p=>p.y);
 const rx=(Math.max(...xs)-Math.min(...xs))/2,ry=(Math.max(...ys)-Math.min(...ys))/2;
 const x=(Math.max(...xs)+Math.min(...xs))/2,y=(Math.max(...ys)+Math.min(...ys))/2,r=(rx+ry)/2;
 if(r<65||rx/ry<.55||rx/ry>1.8)return null;
 const first=stroke[0],last=stroke.at(-1);
 if(Math.hypot(first.x-last.x,first.y-last.y)>r*.65)return null;
 const bins=new Set();let error=0,length=0;
 for(let i=0;i<stroke.length;i++){
  const p=stroke[i],nx=(p.x-x)/rx,ny=(p.y-y)/ry;
  error+=Math.abs(Math.hypot(nx,ny)-1);
  bins.add(Math.floor((Math.atan2(ny,nx)+Math.PI)/(Math.PI*2)*12)%12);
  if(i)length+=Math.hypot(p.x-stroke[i-1].x,p.y-stroke[i-1].y);
 }
 if(error/stroke.length>.28||bins.size<11||length<4.4*r||length>9*r)return null;
 return {x,y,r};
}
canvas.addEventListener('pointerdown',e=>{if(pointerId!==null||e.button!==0)return;pointerId=e.pointerId;canvas.setPointerCapture(e.pointerId);drawing=true;portal=null;points=[{x:e.clientX,y:e.clientY}];status.textContent='빛의 선을 이어 원을 닫아 주세요.';});
canvas.addEventListener('pointermove',e=>{if(!drawing||e.pointerId!==pointerId)return;const last=points.at(-1);if(points.length<3000&&Math.hypot(e.clientX-last.x,e.clientY-last.y)>3)points.push({x:e.clientX,y:e.clientY});});
canvas.addEventListener('pointerup',e=>{
 if(e.pointerId!==pointerId)return;
 points.push({x:e.clientX,y:e.clientY});drawing=false;pointerId=null;
 const result=circleFromStroke(points);
 portal=result?{...result,born:performance.now()}:null;points=[];
 status.textContent=portal?(stream?'포털이 열렸어요. 내 얼굴이 요정 얼굴에 비칩니다.':'포털이 열렸어요. 웹캠을 켜서 요정에게 내 얼굴을 비춰 주세요.'):'조금 더 크고 둥글게, 시작점까지 이어 그려 주세요.';
});
function cancelStroke(){if(!drawing)return;drawing=false;points=[];pointerId=null;status.textContent='그리기가 멈췄어요. 원을 다시 그려 주세요.';}
canvas.addEventListener('pointercancel',cancelStroke);canvas.addEventListener('lostpointercapture',cancelStroke);window.addEventListener('blur',cancelStroke);
document.querySelector('#reset').onclick=()=>{portal=null;points=[];drawing=false;pointerId=null;status.textContent='새로운 원을 그려 보세요.';};

function faceSource(){const cw=Math.min(video.videoWidth*.38,video.videoHeight*.72*.78),ch=cw/.78;return [(video.videoWidth-cw)/2,(video.videoHeight-ch)*.4,cw,ch];}
function drawFace(context,x,y,rx,ry){
 context.save();context.beginPath();context.ellipse(x,y,rx,ry,0,0,Math.PI*2);context.clip();
 context.fillStyle='#d9b596';context.fillRect(x-rx,y-ry,rx*2,ry*2);
 if(stream&&video.readyState>=2&&video.videoWidth){const [sx,sy,sw,sh]=faceSource();context.translate(x,y);context.scale(-1,1);context.drawImage(video,sx,sy,sw,sh,-rx,-ry,rx*2,ry*2);}
 else{context.fillStyle='#3c4535';for(const dx of [-rx*.35,rx*.35]){context.beginPath();context.ellipse(x+dx,y-ry*.05,rx*.07,ry*.07,0,0,Math.PI*2);context.fill();}context.strokeStyle='#90665b';context.lineWidth=1.3;context.beginPath();context.arc(x,y+ry*.17,rx*.25,.1,Math.PI-.1);context.stroke();}
 context.restore();
}
function fairy(x,y,size,now){
 ctx.save();ctx.translate(x,y+(reducedMotion?0:Math.sin(now/1100)*5));ctx.scale(size,size);
 // 반투명 날개와 나뭇잎 드레스. 얼굴 부분에만 웹캠 영상을 비춥니다.
 for(const side of [-1,1])for(const lower of [false,true]){
  ctx.save();ctx.translate(side*29,lower?24:-12);ctx.rotate(side*(lower?.65:-.55));
  const wing=ctx.createLinearGradient(0,-60,0,60);wing.addColorStop(0,'#e4f5cbad');wing.addColorStop(1,'#8dcbb525');
  ctx.fillStyle=wing;ctx.strokeStyle='#dcf7c787';ctx.lineWidth=1;ctx.shadowColor='#d9ffc2';ctx.shadowBlur=18;ctx.beginPath();ctx.ellipse(side*18,0,lower?24:31,lower?39:57,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();
 }
 ctx.strokeStyle='#d9b596';ctx.lineCap='round';ctx.lineWidth=9;
 for(const side of [-1,1]){ctx.beginPath();ctx.moveTo(side*12,55);ctx.lineTo(side*17,94);ctx.stroke();ctx.beginPath();ctx.moveTo(side*15,-5);ctx.quadraticCurveTo(side*31,8,side*41,27);ctx.stroke();}
 const dress=ctx.createLinearGradient(-28,-10,32,70);dress.addColorStop(0,'#dce6a0');dress.addColorStop(.45,'#78a970');dress.addColorStop(1,'#254d3f');ctx.fillStyle=dress;ctx.beginPath();ctx.moveTo(-17,-21);ctx.quadraticCurveTo(-14,15,-38,67);ctx.quadraticCurveTo(-10,60,0,73);ctx.quadraticCurveTo(13,58,38,67);ctx.quadraticCurveTo(14,13,17,-21);ctx.closePath();ctx.fill();
 ctx.fillStyle='#443c2e';ctx.beginPath();ctx.ellipse(0,-64,30,39,0,0,Math.PI*2);ctx.fill();drawFace(ctx,0,-62,25,32);
 ctx.strokeStyle='#d8ec9d';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-62,29,Math.PI*1.12,Math.PI*1.88);ctx.stroke();
 for(let i=0;i<5;i++){const a=Math.PI*1.16+i*.53;ctx.fillStyle=i%2?'#f7ebbc':'#cfe5d8';ctx.beginPath();ctx.arc(Math.cos(a)*29,-62+Math.sin(a)*35,3.3,0,Math.PI*2);ctx.fill();}
 ctx.restore();
}
function polygonPath(){ctx.beginPath();if(!points.length)return;ctx.moveTo(points[0].x,points[0].y);for(const p of points)ctx.lineTo(p.x,p.y);ctx.closePath();}
function forestScene(bounds,now){
 ctx.fillStyle='#10291e';ctx.fillRect(0,0,w,h);
 if(forest.complete&&forest.naturalWidth){const scale=Math.max(w/forest.width,h/forest.height);ctx.drawImage(forest,(w-forest.width*scale)/2,(h-forest.height*scale)/2,forest.width*scale,forest.height*scale);}
 ctx.fillStyle='#06110835';ctx.fillRect(0,0,w,h);
 if(bounds)fairy(bounds.x,bounds.y,Math.min(1.7,bounds.r/155),now);
}
function frame(now){
 ctx.clearRect(0,0,w,h);ctx.fillStyle='#030907';ctx.fillRect(0,0,w,h);
 const aura=ctx.createRadialGradient(w*.5,h*.5,0,w*.5,h*.5,Math.max(w,h)*.6);aura.addColorStop(0,'#18302255');aura.addColorStop(1,'#03090700');ctx.fillStyle=aura;ctx.fillRect(0,0,w,h);
 if(portal||points.length>2){
  ctx.save();if(portal){ctx.beginPath();ctx.arc(portal.x,portal.y,portal.r,0,Math.PI*2);}else polygonPath();ctx.clip();forestScene(portal,now);ctx.restore();
 }
 ctx.save();ctx.lineWidth=2.5;ctx.strokeStyle='#e0efbc';ctx.shadowColor='#b7f3a4';ctx.shadowBlur=20;ctx.lineJoin=ctx.lineCap='round';ctx.beginPath();
 if(portal){ctx.arc(portal.x,portal.y,portal.r,0,Math.PI*2);}else if(points.length){ctx.moveTo(points[0].x,points[0].y);for(const p of points)ctx.lineTo(p.x,p.y);}
 ctx.stroke();ctx.lineWidth=8;ctx.strokeStyle='#adf3bd25';ctx.stroke();ctx.restore();
 if(stream&&video.readyState>=2)drawFace(faceCtx,66,84,66,84);
 requestAnimationFrame(frame);
}
forest.onerror=()=>{status.textContent='숲 배경을 읽지 못했어요. forest.png 파일을 확인해 주세요.';};
function stopCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;preview.style.display='none';camera.textContent='웹캠 켜기';}
camera.onclick=async()=>{
 if(stream){stopCamera();status.textContent='웹캠을 껐어요.';return;}
 if(!navigator.mediaDevices?.getUserMedia){status.textContent='포털 시작하기.cmd 파일로 다시 열어 주세요.';return;}
 camera.disabled=true;status.textContent='Chrome에서 카메라 사용을 허용해 주세요.';
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},facingMode:'user'},audio:false});
  video.srcObject=stream;await video.play();camera.textContent='웹캠 끄기';preview.style.display='block';
  stream.getVideoTracks()[0].addEventListener('ended',()=>{stopCamera();status.textContent='카메라 연결이 끝났어요. 다시 켤 수 있어요.';});
  status.textContent='왼쪽 작은 타원에 얼굴을 맞추고, 커다란 원을 그려 보세요.';
 }catch(e){stopCamera();status.textContent=e.name==='NotAllowedError'?'카메라 권한이 필요해요. Chrome 주소 옆 설정에서 카메라를 허용해 주세요.':e.name==='NotFoundError'?'연결된 웹캠을 찾지 못했어요.':'웹캠을 열지 못했어요. 다른 앱에서 사용 중인지 확인해 주세요.';}
 finally{camera.disabled=false;}
};
window.addEventListener('pagehide',stopCamera);
const fullButton=document.querySelector('#fullscreen');fullButton.onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{status.textContent='F11 키로 전체 화면을 열 수 있어요.';}};
document.addEventListener('fullscreenchange',()=>{fullButton.textContent=document.fullscreenElement?'화면 줄이기':'전체 화면';});
requestAnimationFrame(frame);
</script>
</body>
</html>
